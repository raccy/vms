- name: Run bundle install
  ansible.builtin.shell:
    cmd: bundle install
    executable: /bin/bash
    chdir: ~/nodokan
  changed_when: true

- name: Run rails yarn:install
  ansible.builtin.shell:
    cmd: bin/rails yarn:install
    executable: /bin/bash
    chdir: ~/nodokan
  changed_when: true

