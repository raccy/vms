- name: Run rails db:setup
  ansible.builtin.shell:
    cmd: bin/rails db:setup
    executable: /bin/bash
    chdir: ~/nodokan
  changed_when: true

- name: Run rails db:setup
  ansible.builtin.shell:
    cmd: bin/rails radius:setup
    executable: /bin/bash
