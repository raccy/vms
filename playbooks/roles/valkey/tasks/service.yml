- name: Start and enable valkey service
  become: true
  ansible.builtin.service:
    name: '{{ valkey_service_name }}'
    state: started
    enabled: true
  when: valkey_service

- name: Stop and disbale valkey service
  become: true
  ansible.builtin.service:
    name: '{{ valkey_service_name }}'
    state: stopped
    enabled: false
  when: not valkey_service
