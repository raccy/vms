- name: Task install on git
  ansible.builtin.import_role:
    name: git
    tasks_from: install

- name: Git clone anyenv
  ansible.builtin.git:
    repo: https://github.com/anyenv/anyenv
    dest: ~/.anyenv
  environment: '{{ proxy_env }}'

- name: Block anyenv in bashrc
  ansible.builtin.blockinfile:
    path: ~/.bashrc
    marker: '# {mark} ANSIBLE MANAGED BLOCK anyenv'
    block: |
      if ! [[ "$PATH" =~ "$HOME/.anyenv/bin:" ]]
      then
          export PATH="$HOME/.anyenv/bin:$PATH"
      fi
      eval "$(anyenv init -)"

- name: Make anyenv plugins directory
  ansible.builtin.file:
    path: ~/.anyenv/plugins
    state: directory
    mode: '0755'
  when: anyenv_update

- name: Git clone anyenv-update
  ansible.builtin.git:
    repo: https://github.com/znz/anyenv-update.git
    dest: ~/.anyenv/plugins/anyenv-update
  environment: '{{ proxy_env }}'
  when: anyenv_update

# TODO: -iがないとUbuntuとかは.bashrcが実行されない
- name: Run anyenv install init
  ansible.builtin.shell:
    cmd: |
      . ~/.bashrc
      anyenv install --force-init
    executable: /bin/bash
  register: anyenv_install_init_result
  failed_when: anyenv_install_init_result.rc >= 2
  changed_when: anyenv_install_init_result.rc == 0
  environment: '{{ proxy_env }}'
