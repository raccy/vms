- name: 'Install anyenv {{ anyenv_env }}'
  ansible.builtin.shell:
    cmd: |
      {{ anyenv_shell_block }}
      anyenv install {{ anyenv_env }}
    executable: /bin/bash
    creates: '~/.anyenv/envs/{{ anyenv_env }}'
  changed_when: true

- name: Enable crb repo for rbenv
  become: true
  ansible.builtin.command:
    cmd: dnf config-manager --set-enabled crb
  register: result_dnf_config_manager
  changed_when: result_dnf_config_manager.rc == 0
  when:
    - anyenv_env == "rbenv"
    - ansible_facts.os_family == "RedHat"
    - ansible_facts.distribution_major_version | int >= 9

- name: Set require packeges for {{ anyenv_env }}
  ansible.builtin.set_fact:
    anyenv_env_pkgs: >-
      {{
        anyenv_pkgs[anyenv_env][ansible_facts.distribution ~ ansible_facts.distribution_major_version] | default([])
        | union(anyenv_pkgs[anyenv_env][ansible_facts.distribution] | default([]))
        | union(anyenv_pkgs[anyenv_env][ansible_facts.os_family] | default([]))
      }}
  when: anyenv_pkgs[anyenv_env] is defined

- name: 'Task install on app for {{ anyenv_env }}'
  ansible.builtin.include_role:
    name: app
    tasks_from: install
  vars:
    app_install:
      pkgs: '{{ anyenv_env_pkgs }}'
  when:
    - anyenv_pkgs[anyenv_env] is defined
    - anyenv_env_pkgs != []
