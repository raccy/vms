- name: 'Check {{ anyenv_env }}'
  ansible.builtin.shell:
    cmd: |
      . ~/.bashrc
      {{ anyenv_env }} --version
  register: anyenv_env_check_result
  failed_when: false
  changed_when: false

- name: 'Install anyenv {{ anyenv_env }}'
  ansible.builtin.shell:
    cmd: |
      . ~/.bashrc
      anyenv install --force {{ anyenv_env }}
  changed_when: true
  when: anyenv_env_check_result.rc != 0

- name: Enable crb repo for rbenv
  become: true
  ansible.builtin.command:
    cmd: dnf config-manager --set-enabled crb
  register: result_dnf_config_manager
  changed_when: result_dnf_config_manager.rc == 0
  when:
    - anyenv_env == "rbenv"
    - ansible_facts.os_family == "RedHat"
    - ansible_facts.distribution_major_version | int >= 9

- name: Set require packeges for {{ anyenv_env }}
  ansible.builtin.set_fact:
    anyenv_env_pkgs: >-
      {{
        anyenv_pkgs[anyenv_env][ansible_facts.distribution ~ ansible_facts.distribution_major_version] | default(
          anyenv_pkgs[anyenv_env][ansible_facts.distribution] | default(
            anyenv_pkgs[anyenv_env][ansible_facts.os_family] | default([])
          )
        )
      }}
  when: anyenv_pkgs[anyenv_env] is defined

- name: 'Task install on app for {{ anyenv_env }}'
  ansible.builtin.include_role:
    name: app
    tasks_from: install
  vars:
    app_install:
      pkgs: '{{ anyenv_env_pkgs }}'
  when:
    - anyenv_pkgs[anyenv_env] is defined
    - anyenv_env_pkgs != []
