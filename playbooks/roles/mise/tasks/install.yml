# use mise.run

- name: Run mise.run
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl https://mise.run | sh
    executable: /bin/bash
    creates: ~/.local/bin/mise
  environment: '{{ proxy_env }}'

- name: Block mise in bashrc
  ansible.builtin.blockinfile:
    path: ~/.bashrc
    marker: '# {mark} ANSIBLE MANAGED BLOCK mise'
    block: '{{ mise_shell_block }}'
