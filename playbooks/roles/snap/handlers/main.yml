- name: Reload daemon
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: snap_enabled
  listen: snap_reload_daemon

- name: Restart snapd service
  become: true
  ansible.builtin.service:
    name: snapd
    state: restarted
    daemon_reload: true
  when: snap_enabled
  listen: snap_restart_snapd
