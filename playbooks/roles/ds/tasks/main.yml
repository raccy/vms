- name: Task install
  ansible.builtin.import_tasks:
    file: install.yml

- name: Task config
  ansible.builtin.import_tasks:
    file: config.yml

- name: Task serivce
  ansible.builtin.import_tasks:
    file: service.yml

- name: Task entries on ldap
  ansible.builtin.import_role:
    name: ldap
    tasks_from: entries
  when: ds_create_entries
