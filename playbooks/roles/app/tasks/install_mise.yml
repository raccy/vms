# mise
- name: Asssert mise is required
  ansible.builtin.assert:
    that: mise
    fail_msg: mise is required
    quiet: true

- name: Task facts on mise
  ansible.builtin.import_role:
    name: mise
    tasks_from: facts

- name: Set app_install_version to latest if app_install_version is empty
  ansible.builtin.set_fact:
    app_install_version: latest
  when: app_install_version == ""

- name: Install package by mise
  ansible.builtin.shell:
    cmd: |
      {{ mise_shell_block }}
      mise install {{ app_install_name }}@{{ app_install_version }}
    executable: /bin/bash
    creates: '~/.local/share/mise/installs/{{ app_install_name }}/{{ app_install_version }}'
  environment: '{{ proxy_env }}'
  changed_when: true

- name: Set global version for mise
  ansible.builtin.shell:
    cmd: |
      {{ mise_shell_block }}
      mise use -g {{ app_install_name }}@{{ app_install_version }}
    executable: /bin/bash
  changed_when: true
