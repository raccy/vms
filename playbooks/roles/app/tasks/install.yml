- name: Set app_install_* facts from app_install
  ansible.builtin.set_fact:
    app_install_name: '{{ app_install.name | default(None) }}'
    app_install_ver: '{{ app_install.ver | default(None) }}'
    app_install_pkgs: '{{ app_install.pkgs | default([]) }}'
    app_install_src: '{{ app_install.src | default("pkg") }}'
    app_install_recommends: '{{ app_install.recommends | default(true) }}'
    app_install_dev: '{{ app_install.dev | default(false) }}'

- name: 'Task package manager {{ ansible_pkg_mgr }}'
  ansible.builtin.include_tasks:
    file: 'install_{{ ansible_pkg_mgr }}.yml'
  when: app_install_src == "pkg"

# TODO: 他のソース
#   snap, rbenv, pyenv, nodenv, *env

- name: 'Task other source {{ app_install_src }}'
  ansible.builtin.include_tasks:
    file: 'install_{{ app_src }}.yml'
  when: app_install_src != "pkg"
