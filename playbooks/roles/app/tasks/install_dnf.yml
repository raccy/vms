- name: Install version by dnf
  become: true
  ansible.builtin.dnf:
    name: '@{{ app_install_name }}:{{ app_install_ver }}'
    install_weak_deps: '{{ app_install_recommends }}'
  when: app_install_name and app_install_ver

- name: Install package by dnf
  become: true
  ansible.builtin.dnf:
    name: '{{ app_install_name }}'
    install_weak_deps: '{{ app_install_recommends }}'
  when: app_install_name

- name: Install packages by dnf
  become: true
  ansible.builtin.dnf:
    name: '{{ app_install_pkgs }}'
    install_weak_deps: '{{ app_install_recommends }}'
  when: app_install_pkgs | length > 0

- name: Install build packages by dnf
  become: true
  ansible.builtin.dnf:
    name: '@Development Tools'
    install_weak_deps: false
  when: app_install_dev

- name: Install dev packages by dnf
  become: true
  ansible.builtin.dnf:
    name: '{{ app_install_name }}-devel'
    install_weak_deps: '{{ app_install_recommends }}'
  when: app_instnall_name and app_install_dev

