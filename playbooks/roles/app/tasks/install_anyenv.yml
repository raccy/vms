# anyenv
- name: Assert app_install_version is not empty when rbenv is used
  ansible.builtin.assert:
    that: app_install_version != ""
    fail_msg: "app_install_version is required when rbenv is used"
    quiet: true

- name: Asssert anyenv is required and app_install_name is included in anyenv_envs
  ansible.builtin.assert:
    that: anyenv | default(false) and app_install_name in anyenv_envs
    fail_msg: "anyenv is required and {{ app_install_name }} must be included in anyenv_envs"
    quiet: true

- name: Task facts on anyenv
  ansible.builtin.import_role:
    name: anyenv
    tasks_from: facts

- name: Install package by anyenv
  ansible.builtin.shell:
    cmd: |
      {{ anyenv_shell_block }}
      {{ app_install_name }} install -s {{ app_install_version }}
    executable: /bin/bash
  environment: '{{ proxy_env }}'
  register: app_install_anyenv_result_install
  changed_when: app_install_anyenv_result_install.stdout != ""

- name: Get global version for anyenv
  ansible.builtin.shell:
    cmd: |
      {{ anyenv_shell_block }}
      {{ app_install_name }} global
    executable: /bin/bash
  register: app_install_anyenv_result_global
  changed_when: false

- name: Set global version for anyenv
  ansible.builtin.shell:
    cmd: |
      {{ anyenv_shell_block }}
      {{ app_install_name }} global {{ app_install_version }}
    executable: /bin/bash
  changed_when: true
  when: app_install_anyenv_result_global.stdout | trim != app_install_version | string
