# WSL facts
---
# wslinfo --networking-mode
# wsl2:
#   - none
#   - nat (default)
#   - mirrored
#   - virtioproxy
# wsl1:
#   - wsl1
- name: Run wslinfo --networking-mode
  ansible.builtin.command:
    cmd: wslinfo -n --networking-mode
  changed_when: false
  register: wsl_run_wslinfo_networking_mode

- name: Setting wsl_networking_mode
  ansible.builtin.set_fact:
    wsl_networking_mode: '{{ wsl_run_wslinfo_networking_mode.stdout }}'

- name: Setting wsl_version
  ansible.builtin.set_fact:
    wsl_version: '{{ (wsl_networking_mode == "wsl1") | ternary(1, 2) }}'

- name: Check pid 1 proccess
  ansible.builtin.command:
    cmd: ps -p 1 -o %c --no-headers
  changed_when: false
  register: wsl_run_ps_1

- name: Setting systemd
  ansible.builtin.set_fact:
    wsl_systemd: '{{ wsl_run_ps_1.stdout is match "systemd" }}'

- name: Setting wsl facts
  ansible.builtin.set_fact:
    wsl_facts:
      wsl_networking_mode: '{{ wsl_run_wslinfo_networking_mode.stdout }}'
      wsl_version: '{{ (wsl_run_wslinfo_networking_mode.stdout == "wsl1") | ternary(1, 2) }}'
      wsl_systemd: '{{ wsl_run_ps_1.stdout is match "systemd" }}'
