# WSL facts
---
# wslinfo --networking-mode
# wsl2:
#   - none
#   - nat (default)
#   - mirrored
#   - virtioproxy
# wsl1:
#   - wsl1
- name: Run wslinfo --networking-mode
  ansible.builtin.command:
    cmd: wslinfo -n --networking-mode
  changed_when: false
  register: wsl_run_wslinfo_networking_mode

- name: Setting wsl_networking_mode
  ansible.builtin.set_fact:
    wsl_networking_mode: '{{ wsl_run_wslinfo_networking_mode.stdout }}'

- name: Setting wsl_version
  ansible.builtin.set_fact:
    wsl_version: '{{ (wsl_networking_mode == "wsl1") | ternary(1, 2) }}'

- name: Find WSLInterop
  ansible.builtin.find:
    path: /proc/sys/fs/binfmt_misc
    patterns: 'WSLInterop*'
  register: wsl_find_interop

- name: Setting interop facts
  ansible.builtin.set_fact:
    wsl_interop: '{{ wsl_find_interop.files | length > 0 }}'
