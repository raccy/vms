- name: Task install on app for nodejs
  ansible.builtin.include_role:
    name: app
    tasks_from: install
  vars:
    app_install:
      name: '{{ nodejs_name }}'
      version: '{{ nodejs_version }}'
      source: '{{ nodejs_source }}'
      devel: '{{ nodejs_devel }}'
      pkgs: '{{ nodejs_libs | map("regex_replace", "^", nodejs_name ~ "-") }}'
