- name: Get npm config prefix
  ansible.builtin.command:
    cmd: npm config get prefix
  register: nodejso_config_npm_prefix
  changed_when: false
  when: nodejs_source == "pkg"

- name: Set npm config prefix
  ansible.builtin.command:
    cmd: npm config set prefix=~/.local
  changed_when: true
  when:
    - nodejs_source == "pkg"
    - nodejso_config_npm_prefix.stdout | trim == "/usr/local"
