- name: Set nodejs_env fact
  ansible.builtin.set_fact:
    nodejs_env: '{{ nodejs_env | combine({"NODE_USE_SYSTEM_CA": "1"}) }}'
  when:
    - nodejs_source != "pkg"
    - cert_trusted_cas != {}

- name: Task install
  ansible.builtin.import_tasks:
    file: install.yml

- name: Task config
  ansible.builtin.import_tasks:
    file: config.yml

- name: Task pkg_mgr
  ansible.builtin.import_tasks:
    file: pkg_mgr.yml

- name: Task npm
  ansible.builtin.import_tasks:
    file: npm.yml
