- name: Set gui deskotp
  ansible.builtin.set_fact:
    gui_desktop: >-
      {{
        gui_default_desktop[ansible_facts.distribution ~ ansible_facts.distribution_major_version]
          | default(gui_default_desktop[ansible_facts.distribution]
            | default(gui_default_desktop[ansible_facts.os_family]
              | default("")))
      }}
  when: gui_desktop is not defined

- name: Task install on app for gui
  ansible.builtin.include_role:
    name: app
    tasks_from: install
  vars:
    app_install:
      name: '{{ gui_desktop }}'
      pkgs: '{{ gui_pkgs }}'

# https://github.com/microsoft/wslg/issues/960
- name: Stop and disable serivce for GDM
  become: true
  ansible.builtin.service:
    name: gdm
    enabled: false
    state: stopped
  when:
    - ansible_facts.virtualization_type == "wsl"
    - ansible_facts.distribution == "Ubuntu"
