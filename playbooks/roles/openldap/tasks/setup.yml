- name: Start and enable openldap service
  become: true
  ansible.builtin.service:
    name: '{{ openldap_service_name }}'
    state: started

- name: Task entries on ldap
  ansible.builtin.import_role:
    name: ldap
    tasks_from: entries

- name: Stop and disbale openlda service
  become: true
  ansible.builtin.service:
    name: '{{ openldap_service_name }}'
    state: stopped
  when: not openldap_service
