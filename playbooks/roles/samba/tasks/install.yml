- name: Task install on app for nginx
  ansible.builtin.include_role:
    name: app
    tasks_from: install
  vars:
    app_install:
      name: nginx
      ver: '{{ nginx_ver }}'
      src: '{{ nginx_src }}'
      dev: '{{ nginx_dev }}'
      pkgs: '{{ nginx_libs | map("regex_replace", "^", "nginx-") }}'
