- name: Task install on app for ruby
  ansible.builtin.include_role:
    name: app
    tasks_from: install
  vars:
    app_install:
      name: '{{ ruby_name }}'
      version: '{{ ruby_version }}'
      source: '{{ ruby_source }}'
      devel: '{{ ruby_devel }}'
      pkgs: '{{ ruby_libs | map("regex_replace", "^", ruby_name ~ "-") }}'
