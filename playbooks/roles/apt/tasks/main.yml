- name: Assert ansible_facts.pkg_mgr is apt
  ansible.builtin.assert:
    that: ansible_facts.pkg_mgr == "apt"
    msg: "ansible_facts.pkg_mgr is not apt, but {{ ansible_facts.pkg_mgr }}"
    quiet: true

# NOTE: Do not use role_path directly in the included role, because it will be changed to the included role's path.
- name: Set apt_role_path fact
  ansible.builtin.set_fact:
    apt_role_path: '{{ role_path }}'

- name: Task etc on proxy
  ansible.builtin.include_role:
    name: proxy
    tasks_from: etc
  vars:
    proxy_etc_role_path: '{{ apt_role_path }}'
    proxy_etc_files: '{{ apt_proxy_etc_files }}'
  when: proxy_env != {}
