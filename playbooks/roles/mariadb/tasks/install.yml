- name: Task install on app for mariadb
  ansible.builtin.include_role:
    name: app
    tasks_from: install
  vars:
    app_install:
      name: mariadb
      ver: '{{ mariadb_ver }}'
      src: '{{ mariadb_src }}'
      dev: '{{ mariadb_dev }}'

- name: Task install on app for mariadb libs by pkg only
  ansible.builtin.include_role:
    name: app
    tasks_from: install
  vars:
    app_install:
      pkgs: '{{ mariadb_libs | map("regex_replace", "^", "mariadb-") }}'
  when:
    - mariadb_src == "pkg"
    - mariadb_libs | length > 0
